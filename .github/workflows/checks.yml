name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install 'numpy>=1.24,<2'
      - name: Check Python syntax
        run: python -m compileall -q config_tuner experiments keyword_extractor preprocess_servers tests util vidrag_pipeline main.py script_preprocess.py script_run_inference.py
      - name: Run CPU tests
        run: python -m unittest discover -s tests -v
      - name: Check command-line entry points
        run: |
          python main.py --list
          python script_preprocess.py --help
          python -m experiments.profile_latency --help
